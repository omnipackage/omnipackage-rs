[package]
name = "omnipackage"
description = "Build and distribute RPM, DEB & Arch packages easily"
version = "0.1.21"
edition = "2024"
rust-version = "1.95"
authors = ["Oleg Antonyan <oleg.b.antonyan@gmail.com>"]
license-file = "LICENSE"
homepage = "https://omnipackage.org/"
repository = "https://github.com/omnipackage/omnipackage-rs"
documentation = "https://docs.omnipackage.org/"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
liquid = "0"
regex = "1"
tempfile = "3"
subprocess = "1"
chrono = "0.4"
glob = "0"
dotenvy = "0.15"
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "http-1x", "sigv4a"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
base64 = "0.23"
reqwest = { version = "0.13", features = ["json", "blocking"] }
anyhow = "1"
sha2 = "0.11"

[dev-dependencies]
assert_cmd = "*"
predicates = "*"
